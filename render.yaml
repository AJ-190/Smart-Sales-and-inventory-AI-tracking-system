services:
  - type: web
    name: smart-sales-inventory
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT
    plan: free
    # Debt reminders (and the sale summaries) only run if a worker and a beat
    # process exist. Without these two services the schedule is defined but
    # never fires, and no SMS is ever sent.
  - type: worker
    name: smart-sales-inventory-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A src.celery_tasks.celery_app:celery worker --loglevel=info --concurrency=2
    plan: free
  - type: worker
    name: smart-sales-inventory-beat
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A src.celery_tasks.celery_app:celery beat --loglevel=info
    plan: free