services:
  - type: web
    name: smart-sales-inventory
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT
    plan: free
    # The free plan spins this down after 15 minutes idle. The Keep Alive
    # GitHub Actions workflow (/.github/workflows/keep-alive.yml) pings it
    # every 10 minutes so it stays warm.
    #
    # There are deliberately no worker/beat services: Celery was removed in
    # favour of APScheduler, and nothing calls start_report_schedulers() yet.
    # See the "Scheduled Jobs Not Wired Up" section of README.md.