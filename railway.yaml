build:
  builder: NIXPACKS

deploy:
  startCommand: python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT
  restartPolicyType: ON_FAILURE
  restartPolicyMaxRetries: 3

# NOTE: Railway runs ONE process per service, and this file describes only the
# web service. Debt reminders additionally need two more Railway services built
# from the same repo, or the Celery beat schedule never fires:
#
#   worker -> celery -A src.celery_tasks.celery_app:celery worker --loglevel=info
#   beat   -> celery -A src.celery_tasks.celery_app:celery beat --loglevel=info
#
# Do not add them as extra processes here - a crashed worker would take the API
# down with it.