build:
  builder: NIXPACKS

deploy:
  startCommand: python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT
  restartPolicyType: ON_FAILURE
  restartPolicyMaxRetries: 3

# NOTE: Railway runs ONE process per service, and this file describes only the
# web service. The Celery worker/beat services that used to be documented here
# were removed in favour of APScheduler (src/tasks/).
#
# No scheduler process is started today: nothing calls start_report_schedulers()
# and process_due_reminders() has no add_job registration. See the
# "Scheduled Jobs Not Wired Up" section of README.md.